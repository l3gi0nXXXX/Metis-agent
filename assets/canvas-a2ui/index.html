<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metis Canvas A2UI</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(23, 32, 42, 0.12);
        background: #ffffff;
      }

      footer {
        border-top: 1px solid rgba(23, 32, 42, 0.12);
        border-bottom: 0;
        font-size: 12px;
        color: #5a6470;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      main {
        padding: 16px;
      }

      #metis-a2ui-root {
        display: grid;
        gap: 10px;
      }

      .metis-a2ui-message {
        border: 1px solid rgba(23, 32, 42, 0.12);
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Metis Canvas A2UI</h1>
    </header>
    <main id="metis-a2ui-root" aria-live="polite"></main>
    <footer id="metis-a2ui-status">Ready</footer>
    <script src="./a2ui.bundle.js"></script>
  </body>
</html>
